---
layout: base
---
<article class="page-content">
  {% if page.title %}
    <header class="page-header">
      {% if page.eyebrow != false %}<p class="eyebrow">{{ page.eyebrow | default: "Previous site" }}</p>{% endif %}
      <h1>{{ page.title | smartify | escape }}</h1>
    </header>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
