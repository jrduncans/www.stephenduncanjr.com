# The single Ruby pin for local work and CI. The Gemfile reads this `ruby` line
# with `ruby file: "mise.toml"`, so keep it first among lines starting "ruby".
[tools]
ruby = "4.0.9"
# hk and the linters its steps run; keep hk in step with the package version in hk.pkl.
hk = "2.12.0"
pkl = "0.33.0"
jactionlint = "2.5.0"
zizmor = "1.32.0"
pinact = "5.0.2"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"

[settings]
# Use prebuilt Ruby binaries instead of compiling, locally and in CI.
ruby.compile = false
