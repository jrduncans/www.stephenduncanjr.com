title: Stephen Duncan Jr.
email: webmaster@stephenduncanjr.com
description: A little bit of everything from Stephen Duncan Jr, a Software Developer in Portland, Oregon
baseurl: ""
url: https://www.stephenduncanjr.com
permalink: /:year/:month/:title:output_ext
excerpt_separator: ""

exclude:
  - s3_website.yml
  - docs
  - bin
  - test

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-archives

defaults:
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Stephen
  -
    scope:
      path: ""
      type: pages
    values:
      legacy: true

jekyll-archives:
  enabled:
    - month
    - tags
