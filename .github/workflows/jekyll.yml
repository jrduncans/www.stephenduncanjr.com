name: Build and deploy site

on:
  pull_request:
  push:
    branches:
      - main

# A newer pull request push cancels the older run; pushes to main each get their
# own group and never cancel. The deploy job also serializes on github-pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      TZ: America/Los_Angeles
      JEKYLL_ENV: production
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DEPLOYMENT: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby and tools with mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Cache gems
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('mise.toml', 'Gemfile.lock') }}

      - name: Install gems
        run: bundle install --jobs 4

      - name: Run hk checks
        run: hk check --all

      - name: Build production site
        run: bundle exec jekyll build --destination ./_site

      - name: Run site checks
        run: bundle exec bin/check-site

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          ruby -ryaml -e 'File.write(File.join(ENV.fetch("RUNNER_TEMP"), "jekyll-pages-config.yml"), {"url" => ENV.fetch("PAGES_ORIGIN"), "baseurl" => ENV.fetch("PAGES_BASE_PATH")}.to_yaml)'
          bundle exec jekyll build \
            --destination ./_site \
            --config _config.yml,"${RUNNER_TEMP}/jekyll-pages-config.yml"

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
